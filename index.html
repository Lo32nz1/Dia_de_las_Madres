<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de las Madres</title>
<style>
:root{--bg1:#fff0f6;--bg2:#ffd3e6;--ink:#7a1f4d;--card:#ffffff;--accent:#e91e8c;--accent2:#ff7ab8;--soft:#ffe3ef;--line:#f3a6c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0f1e;--bg2:#431530;--ink:#ffd6e8;--card:#4a1b33;--accent:#ff5fa8;--accent2:#c2307a;--soft:#5a2340;--line:#a8456f;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a0f1e;--bg2:#431530;--ink:#ffd6e8;--card:#4a1b33;--accent:#ff5fa8;--accent2:#c2307a;--soft:#5a2340;--line:#a8456f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--bg1),var(--bg2));padding:1.2rem}
header{text-align:center;margin-bottom:1rem}
h1{margin:0;font-family:'Segoe Script','Brush Script MT',Georgia,cursive;font-size:clamp(2rem,6vw,3.6rem);color:var(--accent)}
.sub{margin-top:.3rem;font-size:1rem;opacity:.85}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:1rem}
.last{background:var(--card);border:2px solid var(--accent);border-radius:999px;padding:6px 18px;font-weight:700}
.last b{font-size:1.5rem;color:var(--accent)}
button{font:inherit;border:none;border-radius:999px;padding:9px 18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 3px 8px rgba(233,30,140,.3)}
button:hover{filter:brightness(1.08)}
button.ghost{background:var(--card);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.layout{display:flex;gap:16px;align-items:flex-start;max-width:1300px;margin:0 auto}
.board{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:8px}
.flip{perspective:800px;aspect-ratio:1}
.inner{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip{position:relative}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(11px,1.9vw,24px);border:2px solid var(--line);box-shadow:0 3px 6px rgba(122,31,77,.12)}
.front{background:var(--card);color:var(--ink)}
.front:hover{background:var(--soft)}
.back{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:var(--accent);transform:rotateY(180deg)}
.back::after{content:"♥";position:absolute;top:2px;right:5px;font-size:.5em;opacity:.85}
aside{width:300px;flex:none;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
aside[hidden]{display:none}
aside h2{margin:0 0 6px;font-size:1.05rem;color:var(--accent)}
aside h2 small{font-weight:400;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:30px}
.chip{background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:8px;padding:3px 9px;font-size:.95rem}
.chip small{opacity:.6;margin-right:4px}
.empty{opacity:.6;font-size:.9rem}
.hint{font-size:.8rem;opacity:.7;margin:0}
@media (max-width:820px){.layout{flex-direction:column}aside{width:100%;position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <h1>Feliz Día de las Madres</h1>
  <div class="sub">♥ Tocá un número para marcarlo, tocalo de nuevo para desmarcarlo ♥</div>
</header>

<div class="bar">
  <div class="last">Último: <b id="last">–</b></div>
  <button id="toggle" class="ghost" aria-expanded="false">Historial (<span id="count">0</span>)</button>
  <button id="reset" class="ghost">Reiniciar</button>
</div>

<div class="layout">
  <main class="board"><div class="grid" id="grid"></div></main>
  <aside id="panel" hidden>
    <h2>Orden de salida <small>(por turno)</small></h2>
    <div class="chips" id="byTurn"></div>
    <h2>Orden creciente</h2>
    <div class="chips" id="sorted"></div>
    <p class="hint">Tocá un número del historial para desmarcarlo.</p>
  </aside>
</div>

<script>
const KEY = 'bingo-madres';
const order = [];
const cards = {};
const $ = id => document.getElementById(id);

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || '[]');
  if (Array.isArray(saved)) saved.forEach(n => { if (Number.isInteger(n) && n >= 1 && n <= 99 && !order.includes(n)) order.push(n); });
} catch (e) {}

for (let i = 1; i <= 99; i++) {
  const f = document.createElement('div');
  f.className = 'flip';
  f.innerHTML = '<div class="inner"><div class="face front">' + i + '</div><div class="face back">' + i + '</div></div>';
  f.addEventListener('click', () => toggle(i));
  $('grid').appendChild(f);
  cards[i] = f;
}

function toggle(n) {
  const k = order.indexOf(n);
  if (k > -1) order.splice(k, 1); else order.push(n);
  render();
  try { localStorage.setItem(KEY, JSON.stringify(order)); } catch (e) {}
}

function chips(el, list, numbered) {
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = '<span class="empty">Todavía no salió ninguno</span>'; return; }
  list.forEach((n, idx) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.title = 'Desmarcar ' + n;
    b.innerHTML = (numbered ? '<small>' + (idx + 1) + '.</small>' : '') + n;
    b.addEventListener('click', () => toggle(n));
    el.appendChild(b);
  });
}

function render() {
  for (let i = 1; i <= 99; i++) cards[i].classList.toggle('on', order.includes(i));
  $('count').textContent = order.length;
  $('last').textContent = order.length ? order[order.length - 1] : '–';
  chips($('byTurn'), order, true);
  chips($('sorted'), [...order].sort((a, b) => a - b), false);
}

$('toggle').addEventListener('click', () => {
  const p = $('panel');
  p.hidden = !p.hidden;
  $('toggle').setAttribute('aria-expanded', String(!p.hidden));
});

let armed = null;
$('reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (armed) {
    clearTimeout(armed); armed = null; b.textContent = 'Reiniciar';
    order.length = 0; render();
    try { localStorage.setItem(KEY, '[]'); } catch (err) {}
  } else {
    b.textContent = '¿Seguro? Tocá de nuevo';
    armed = setTimeout(() => { armed = null; b.textContent = 'Reiniciar'; }, 3000);
  }
});

render();
</script>
</body>
</html>
